<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasty Bites Restaurant</title>

    <style>
        header{
            background-color: #f30909;
            color: white;
            text-align: center;
        }

        h2{
            color: rgb(131, 12, 12);
            text-align: center;
        }
        main{
            background-color: #ffe76c;
        }
        
        .one{
            background-color: lightpink;
            color: red;
            text-align: center;
        }
        footer{
            background-color: rgb(38, 3, 3);
            color: white;

        }
        .last{
            text-align: right;
        }

    </style>
</head>
<body>
    <header>
        <h1>Tasty Bites Restaurant</h1>
        <p>
            Good Food Makes a Better Mood
        </p>
    </header>

   <main>
     <h2>Our Special Dishes</h2>

     <table border="1"
            style="width: 100%;
                  text-align: center;">

        <tr style="background-color: #ff8229; color: white;">
            <th style="padding: 10px;">Dish Name</th>
            <th style="padding: 10px;">Type</th>
            <th style="padding: 10px;">Price</th>
        </tr>

        <tr style="background-color: #ffe76c; color: black;">
            <td style="padding: 10px;">Margherita Pizza</td>
            <td style="padding: 10px;">Veg</td>
            <td style="padding: 10px;">₹249</td>
        </tr>

        <tr style="background-color: #ffe76c; color: rgb(0, 0, 0);">
            <td style="padding: 10px;">Paneer Butter Masala</td>
            <td style="padding: 10px;">Veg</td>
            <td style="padding: 10px;">₹279</td>
        </tr>

        <tr style="background-color: #ffe76c; color: #000000;">
            <td style="padding: 10px;">Chicken Biryani</td>
            <td style="padding: 10px;">Non-Veg</td>
            <td style="padding: 10px;">₹299</td>
        </tr>

        <tr style="background-color: #ffe76c; color: black;">
            <td style="padding: 10px;">Chocolate Brownie</td>
            <td style="padding: 10px;">Dessert</td>
            <td style="padding: 10px;">₹149</td>
        </tr>
    </table>
   </main>

    
    <h2 class="one">Visit Us & Enjoy Delicious Food!</h2>

    <footer>
        <p>Open Daily: 11 AM - 11 PM</p>
        <p class="last">Thank You!</p>
    </footer>
</body>
</html>
